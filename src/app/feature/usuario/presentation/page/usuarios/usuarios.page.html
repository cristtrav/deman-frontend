<core-feature-layout [title]="'Usuarios'" [toolbarButtons]="toolbarButtons" [searchFn]="buscar">
    <nz-table #tabla nzSize="small" [nzData]="usuarios" [nzLoading]="isLoading">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombres</th>
                <th>Apellidos</th>
                <th>C.I</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            @for (usuario of tabla.data; track usuario.id) {
            <tr>
                <td>{{ usuario.id }}</td>
                <td>{{ usuario.nombres }}</td>
                <td>{{ usuario.apellidos }}</td>
                <td>{{ usuario.ci }}</td>
                <td nz-flex nzGap="small" nzJustify="center">
                    <button nz-button nzType="primary" (click)="editUsuario(usuario)">
                        <nz-icon nzType="edit"></nz-icon>
                    </button>
                    <button nz-button nzType="primary" (click)="editPasswordMode(usuario)">
                        <nz-icon nzType="key"></nz-icon>
                    </button>
                    <button nz-button nzType="primary" nzDanger (click)="confirmDelete(usuario)">
                        <nz-icon nzType="delete"></nz-icon>
                    </button>
                </td>
            </tr>
            }
        </tbody>
    </nz-table>


</core-feature-layout>


<nz-modal [(nzVisible)]="isModalFormVisible" (nzOnCancel)="hideModalForm()" [nzTitle]="modalTitle"
    [nzContent]="modalContent" [nzFooter]="modalFooter">
    <ng-template #modalTitle>
        {{ formMode == 'add' ? 'Crear usuario' : 'Editar usuario' }}
    </ng-template>
    <ng-template #modalContent>
        <usuario-form [(mode)]="formMode" [editingUsuario]="editingUsuario" (isSavingChange)="isSaving = $event"
            (savedUsuario)="onSaved()">
        </usuario-form>
        @if(formMode == 'editPassword'){
        <form [formGroup]="form">
            <nz-form-item>
                <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired>
                    Contraseña
                </nz-form-label>
                <nz-form-control [nzSm]="14" [nzXs]="24" nzErrorTip="La contraseña es requerida. Max. 50 carácteres.">
                    <nz-input-group [nzSuffix]="suffixTemplate">
                        <input nz-input [type]="passwordVisible ? 'text' : 'password'" placeholder="Contraseña"
                            formControlName="password" />
                    </nz-input-group>
                    <ng-template #suffixTemplate>
                        <i nz-icon [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"
                            (click)="passwordVisible = !passwordVisible"></i>
                    </ng-template>
                </nz-form-control>
            </nz-form-item>
        </form>
        }
        <ng-template #notifContainer></ng-template>
    </ng-template>
    <ng-template #modalFooter>
        <div nz-flex nzJustify="flex-end">
            <button nz-button nzType="primary" [nzLoading]="isSaving"
                (click)="formMode === 'editPassword' ? editPassword() : usuarioFormComp.save()">
                <nz-icon nzType="save"></nz-icon>
                {{ formMode === 'editPassword' ? 'Guardar contraseña' : (formMode === 'add' ? 'Registrar' : 'Editar') }}
            </button>
            <button nz-button nzType="default" (click)="usuarioFormComp.resetForm()">
                <nz-icon nzType="clear"></nz-icon>
                {{ formMode == 'add' ? 'Limpiar' : 'Nuevo' }}
            </button>
            <button nz-button nzType="default" (click)="hideModalForm()">
                Cerrar
            </button>
        </div>
    </ng-template>
</nz-modal>
