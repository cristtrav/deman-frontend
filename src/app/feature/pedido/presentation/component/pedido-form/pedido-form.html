<form nz-form [formGroup]="form">
    <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired>
            Código
        </nz-form-label>
        <nz-form-control [nzSm]="16" [nzXs]="24" 
            nzErrorTip="El código es requerido">
            <nz-input-number
                formControlName="id"
                [nzDisabled]="true"
                [nzPlaceHolder]="idMode() == 'auto' ? '(autogenerado)' : 'Ingresar'"
                nzPlaceHolder="200"
                style="width: 100%;"
                [nzMin]="1"
                [nzStep]="1">
            </nz-input-number>
        </nz-form-control>        
    </nz-form-item>
    <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired>
            Cliente
        </nz-form-label>
        <nz-form-control [nzSm]="16" [nzXs]="24" 
            nzErrorTip="El cliente es requerido">
            <div class="cliente-select">
                <nz-select
                    formControlName="clienteId"
                    [nzPlaceHolder]="'Seleccionar...'"
                    [nzShowSearch]="true"
                    [nzServerSearch]="true"
                    [nzAllowClear]="true"
                    [nzDropdownRender]="clientesLoading"
                    (nzOnSearch)="clienteSearch.set($event)"
                    (nzOpenChange)="onClienteSelectOpenChange($event)"
                    (nzScrollToBottom)="clienteFacade.cargarMas()">
                    @for (cliente  of clienteOptions(); track cliente.id) {
                    <nz-option
                        [nzValue]="cliente.id"
                        [nzLabel]="cliente.razonSocial">
                    </nz-option>
                    }
                </nz-select>
                <ng-template #clientesLoading>
                    @if (clienteFacade.loading()) {
                    <div class="clientes-loading">
                        <nz-icon nzType="loading"></nz-icon>
                        Cargando...
                    </div>
                    }
                </ng-template>
                <button
                    nz-button
                    type="button"
                    nzType="default"
                    title="Registrar nuevo cliente"
                    (click)="showClienteModal()">
                    <nz-icon nzType="user-add"></nz-icon>
                </button>
            </div>
        </nz-form-control>
    </nz-form-item>
    <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired>
            F. Pedido
        </nz-form-label>
        <nz-form-control [nzSm]="16" [nzXs]="24" 
            nzErrorTip="La fecha de pedido es requerida">
            <nz-date-picker
                formControlName="fechaPedido"
                [nzFormat]="'dd/MMM/yyyy'"
                [nzPlaceHolder]="'Seleccionar...'"
                [nzDisabledDate]="disabledFPedido"
                style="width: 100%;">
            </nz-date-picker>
        </nz-form-control>
    </nz-form-item>
    <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired>
            F. Entrega
        </nz-form-label>
        <nz-form-control [nzSm]="16" [nzXs]="24" 
            nzErrorTip="La fecha de entrega es requerida">
            <nz-date-picker
                formControlName="fechaEntrega"
                [nzFormat]="'dd/MMM/yyyy'"
                [nzPlaceHolder]="'Seleccionar...'"
                [nzDisabledDate]="disabledFEntrega"
                style="width: 100%;">
            </nz-date-picker>
        </nz-form-control>
    </nz-form-item>
    @if (mode() == 'edit') {
    <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24">
            Entregado el
        </nz-form-label>
        <nz-form-control [nzSm]="16" [nzXs]="24">
            <nz-date-picker
                formControlName="fechaEntregado"
                [nzFormat]="'dd/MMM/yyyy'"
                [nzPlaceHolder]="'Seleccionar...'"
                [nzDisabledDate]="disabledFEntregado"
                style="width: 100%;">
            </nz-date-picker>
        </nz-form-control>
    </nz-form-item>
    }
    <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired>
            Monto Total
        </nz-form-label>
        <nz-form-control [nzSm]="16" [nzXs]="24" 
            nzErrorTip="El monto total es requerido"
            [nzExtra]="totalBloqueado() ? 'El pedido tiene pagos registrados, el total no se puede modificar' : ''">
            <nz-input-number
                formControlName="total"
                [nzPlaceHolder]="'Ingresar'"
                nzPlaceHolder="0"
                style="width: 100%;"
                [nzMin]="0"
                [nzStep]="1">
                <span nzInputAddonBefore>Gs.</span>
            </nz-input-number>
        </nz-form-control>
    </nz-form-item>
    <nz-form-item>
        <nz-form-label [nzSm]="6" [nzXs]="24" nzRequired>
            Descripción
        </nz-form-label>
        <nz-form-control [nzSm]="16" [nzXs]="24"
            nzErrorTip="La descripción es requerida">
            <textarea
                formControlName="descripcion"
                nz-input
                rows="5"
                placeholder="Ingresar...">
            </textarea>
        </nz-form-control>
    </nz-form-item>
</form>
<ng-template #alert></ng-template>

<nz-modal
    [(nzVisible)]="isClienteModalVisible"
    [nzTitle]="'Nuevo cliente'"
    [nzContent]="clienteModalContent"
    [nzFooter]="clienteModalFooter"
    (nzOnCancel)="hideClienteModal()">
</nz-modal>
<ng-template #clienteModalContent>
    <cliente-form
        [mode]="'add'"
        (isSavingChange)="isSavingCliente.set($event)"
        (savedCliente)="onClienteCreado($event)">
    </cliente-form>
</ng-template>
<ng-template #clienteModalFooter>
    <button
        nz-button
        nzType="primary"
        [nzLoading]="isSavingCliente()"
        (click)="clienteFormView()?.save()">
        <nz-icon nzType="save"></nz-icon>
        Registrar
    </button>
    <button nz-button nzType="default" (click)="hideClienteModal()">
        <nz-icon nzType="close"></nz-icon>
        Cerrar
    </button>
</ng-template>
